name: Barchart cookie mint
# Verbatim structure of the working vs3d2_cookies.yml: solves the AWS WAF challenge in a real browser,
# writes data/session/cookies.json, commits it. scripts/mint_cookies.py is stdlib + Playwright only.
on:
  schedule:
    - cron: '0,30 13,14,15,16,17,18,19,20,21 * * 1-5'
  workflow_dispatch:

concurrency:                      # prevent overlapping runs racing on the file
  group: barchart-cookies
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          pip install -q playwright
          playwright install-deps chromium
          playwright install chromium

      - name: Mint
        run: python scripts/mint_cookies.py

      - name: Commit
        run: |
          git config user.name "Cookie Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/session/
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "🔑 Cookies: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi
