# Copy to desk_settings.toml (same folder as app.py). Your copy is never shipped in a release zip, so it survives updates.
# Every key is optional; anything missing falls back to the defaults below. Sidebar changes override for the session.

[account]
c8 = 25000.0          # account size ($)
c9 = 1.0              # max risk per trade (%)
c27 = 8.0             # structural stop distance (SPX pts)
c28 = 0.55            # option delta at entry

[feeds]
price_symbol = "CAPITALCOM:SPX500"   # 24-hour price feed (chart, live price, overnight drift)
vix_print = "08:15"                   # VIX print used for C6
drift_print = "08:20"                 # price print used for C7
rules_feed = "SPX cash 5-min (book)"  # or "Price feed 5-min"
cboe_fallback = true                  # allow CBOE delayed chain when Barchart cannot answer
poll_seconds = 60

[chart]
theme = "dark"                        # dark | light
engine = "TradingView lightweight"    # or "Plotly"
candles = false
candle_opacity = 0.7                  # 0.1 – 1.0, applies to both chart engines
sound = true                          # alert tones (trigger, exit, armed, MEIC defense) — press "🔔 Enable alerts" once per tab
notify = true                         # desktop notifications (the browser asks once, from the Enable button)

[alerts]
armed = true                          # heads-up when a play reaches its trigger zone (S3: price outside the box)
meic_defense = true                   # 5-pt defense + VIX regime-flip alerts for the 09:50 MEIC ticket
