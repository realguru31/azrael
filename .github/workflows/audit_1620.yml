name: 16:20 settlement audit
on:
  schedule:
    - cron: '20 20 * * 1-5'   # 16:20 ET during EDT
    - cron: '20 21 * * 1-5'   # 16:20 ET during EST
  workflow_dispatch:
concurrency:
  group: audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install -q requests pandas numpy tzdata curl_cffi
          pip install -q git+https://github.com/rongardF/tvdatafeed.git
      - name: Audit
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: python workers/audit_worker.py
      - name: Commit
        run: |
          git config user.name "Desk Bot"
          git config user.email "bot@users.noreply.github.com"
          git add store/audits/
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "🧾 audit $(date -u +'%Y-%m-%d %H:%M UTC')"
            git fetch origin main && git rebase origin/main && git push origin main
          fi
